[project]
name = "fellowship-candidate-intelligence"
version = "0.1.0"
description = "ITMO Fellowship: AI-assisted candidate dossier (CV + proposal + ORCID / Scopus / Google Scholar)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "pydantic>=2.7",
    "rapidfuzz>=3.9",
    "python-dotenv>=1.0",
    "anthropic>=0.70",
    "fastembed>=0.9.1",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = ["pytest>=8", "rdata>=0.11", "pandas>=2.2", "gdown>=5.2"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
