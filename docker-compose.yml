services:
  app:
    build: .
    env_file: .env
    volumes:
      - ./data:/app/data          # dossiers, uploads, cache, examples
    restart: unless-stopped
    ports:
      # host:port the app is published on; default only on localhost (use a reverse proxy),
      # e.g. APP_PUBLISH=0.0.0.0:8790 to open it directly on a server that already has a web server
      - "${APP_PUBLISH:-127.0.0.1:8000}:8000"

  caddy:                          # optional reverse proxy with automatic HTTPS: docker compose --profile https up -d
    image: caddy:2.8.4
    profiles: ["https"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
