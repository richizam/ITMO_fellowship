services:
  app:
    build: .
    env_file: .env
    volumes:
      - ./data:/app/data          # dossiers, uploads, cache, examples
    restart: unless-stopped
    expose:
      - "8000"

  caddy:                          # reverse proxy; automatic HTTPS when SITE_ADDRESS is a domain
    image: caddy:2.8.4
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
