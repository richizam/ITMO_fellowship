<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Fellowship Candidate Intelligence{% endblock %}, ITMO Fellowship</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml">
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <a class="logo" href="/" aria-label="На главную">
      <img src="/static/img/itmo-fellowship-logo.png" alt="ITMO Fellowship">
      <span>Candidate Intelligence<br>анализ заявок</span>
    </a>
    <nav class="nav">
      {% set p = request.url.path %}
      <a href="/" class="{{ 'active' if p == '/' else '' }}">Кандидаты</a>
      <a href="/new" class="{{ 'active' if p == '/new' else '' }}">Новая заявка</a>
      <a href="/ai-log" class="{{ 'active' if p == '/ai-log' else '' }}">Журнал AI</a>
      <a href="/how" class="{{ 'active' if p == '/how' else '' }}">Как это работает</a>
      <a href="/method" class="{{ 'active' if p == '/method' else '' }}">Методика</a>
    </nav>
  </div>
</header>
<main>
{% block content %}{% endblock %}
</main>
<footer class="site-footer">
  <div class="wrap">
    <div>ITMO Fellowship Candidate Intelligence</div>
    <div>Рабочая версия для команды программы</div>
  </div>
</footer>
{% block scripts %}{% endblock %}
</body>
</html>
